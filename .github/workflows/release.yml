name: Release Windows EXE

on:
    push:
        tags:
            - "v*"
            - "*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Derive app version from tag
              shell: pwsh
              run: |
                  $tag = "${{ github.ref_name }}"
                  $version = $tag -replace '^v', ''
                  "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: Sync package version for the build
              shell: pwsh
              run: npm version $env:APP_VERSION --no-git-tag-version

            - name: Build portable Windows EXE
              shell: pwsh
              run: |
                  npx electron-builder --win portable --publish never --config.win.signAndEditExecutable=false --config.artifactName="OptiScaler-GUI-$env:APP_VERSION-windows.${ext}"

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      release/*.exe
